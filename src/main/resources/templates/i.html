<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">User Dashboard</h2>
    <div class="card p-3 mb-4">
        <h4>Balance: <span th:text="${balance}"></span> </h4>
    </div>

    <h3 class="mb-3">Your Expenses</h3>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Expense Name</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="expense : ${expenses}">
            <td th:text="${expense.expenseName}"></td>
            <td th:text="${expense.amount}"></td>
            <td th:text="${expense.expenseType}"></td>
            <td th:text="${expense.date}"></td>
        </tr>
        </tbody>
    </table>

    <a href="/expenses/add" class="btn btn-primary">Add New Expense</a>
</div>
</body>
</html>
