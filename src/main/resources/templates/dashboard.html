<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .action-btn {
            transition: all 0.2s ease;
            width: 40px;
        }
        .action-btn:hover {
            transform: scale(1.1);
        }
        .table-hover tbody tr:hover {
            background-color: rgba(13, 110, 253, 0.05);
            transition: background-color 0.2s ease;
        }
        .badge-income {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .badge-expense {
            background-color: #f8d7da;
            color: #842029;
        }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-cash-stack me-2"></i>Expense Tracker
        </a>
        <div class="d-flex">
            <span class="navbar-text text-white me-3">
                <i class="bi bi-person-circle me-1"></i><span th:text="${user.name}"></span>
            </span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4 fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary">
            <i class="bi bi-wallet2 me-2"></i>Your Expenses
        </h2>
        <button class="btn btn-primary rounded-pill" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
            <i class="bi bi-plus-lg me-1"></i> Add New Expense
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th><i class="bi bi-card-heading me-1"></i>Name</th>
                        <th><i class="bi bi-tag me-1"></i>Category</th>
                        <th><i class="bi bi-currency-dollar me-1"></i>Amount</th>
                        <th><i class="bi bi-arrow-left-right me-1"></i>Type</th>
                        <th><i class="bi bi-calendar me-1"></i>Date</th>
                        <th><i class="bi bi-gear me-1"></i>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="expense : ${expenses}">
                        <td th:text="${expense.expenseName}"></td>
                        <td>
                            <span class="badge rounded-pill bg-info text-dark" th:text="${expense.category}"></span>
                        </td>
                        <td th:class="${expense.expenseType.name() == 'CREDIT' ? 'text-success fw-bold' : 'text-danger fw-bold'}"
                            th:text="${expense.expenseType.name() == 'CREDIT' ? '+' : '-'} + ${#numbers.formatDecimal(expense.amount, 1, 2)}">
                        </td>
                        <td>
                            <span th:if="${expense.expenseType.name() == 'CREDIT'}" class="badge badge-income">
                                <i class="bi bi-arrow-down-right"></i> Income
                            </span>
                            <span th:if="${expense.expenseType.name() == 'DEBIT'}" class="badge badge-expense">
                                <i class="bi bi-arrow-up-right"></i> Expense
                            </span>
                        </td>
                        <td th:text="${#temporals.format(expense.date, 'MMM dd, yyyy')}"></td>
                        <td>
                            <div class="btn-group btn-group-sm" role="group">
                                <button class="btn btn-outline-primary action-btn rounded-start"
                                        data-bs-toggle="modal"
                                        data-bs-target="#editExpenseModal"
                                        onclick="prepareEditModal(
                                        '${expense.id}',
                                        '${expense.expenseName}',
                                        '${expense.category}',
                                        '${expense.amount}',
                                        '${expense.expenseType.name()}',
                                        '${#temporals.format(expense.date, 'yyyy-MM-dd')}'
                                    )">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <form th:action="@{/dashboard/delete/{id}(id=${expense.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-outline-danger action-btn rounded-end"
                                            onclick="return confirm('Are you sure you want to delete this expense?')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${expenses.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-exclamation-circle me-2"></i>No expenses found
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add Expense Modal -->
<div class="modal fade" id="addExpenseModal" tabindex="-1" aria-labelledby="addExpenseModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="addExpenseModalLabel">
                    <i class="bi bi-plus-circle me-2"></i>Add New Expense
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/dashboard/add}" method="post" th:object="${newExpense}">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="expenseName" class="form-label">Expense Name</label>
                        <input type="text" class="form-control" id="expenseName" th:field="*{expenseName}" required>
                    </div>
                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="amount" th:field="*{amount}" required>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <input type="text" class="form-control" id="category" th:field="*{category}" required>
                    </div>
                    <div class="mb-3">
                        <label for="expenseType" class="form-label">Type</label>
                        <select class="form-select" id="expenseType" th:field="*{expenseType}" required>
                            <option value="CREDIT">Credit (Income)</option>
                            <option value="DEBIT">Debit (Expense)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date" th:field="*{date}" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Save Expense
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Expense Modal -->
<div class="modal fade" id="editExpenseModal" tabindex="-1" aria-labelledby="editExpenseModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="editExpenseModalLabel">
                    <i class="bi bi-pencil-square me-2"></i>Edit Expense
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/dashboard/edit}" method="post">
                <input type="hidden" id="editId" name="id">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editExpenseName" class="form-label">Expense Name</label>
                        <input type="text" class="form-control" id="editExpenseName" name="expenseName" required>
                    </div>
                    <div class="mb-3">
                        <label for="editAmount" class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-control" id="editAmount" name="amount" required>
                    </div>
                    <div class="mb-3">
                        <label for="editCategory" class="form-label">Category</label>
                        <input type="text" class="form-control" id="editCategory" name="category" required>
                    </div>
                    <div class="mb-3">
                        <label for="editExpenseType" class="form-label">Type</label>
                        <select class="form-select" id="editExpenseType" name="expenseType" required>
                            <option value="CREDIT">Credit (Income)</option>
                            <option value="DEBIT">Debit (Expense)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="editDate" class="form-label">Date</label>
                        <input type="date" class="form-control" id="editDate" name="date" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    console.log("hi1");
    function prepareEditModal(id, name, category, amount, type, date) {
    console.log("hi2");
        document.getElementById('editId').value = id;
        document.getElementById('editExpenseName').value = name;
        document.getElementById('editCategory').value = category;
        document.getElementById('editAmount').value = amount;
        document.getElementById('editExpenseType').value = type;
        document.getElementById('editDate').value = date;
    }

    // Reset form when modal hides
    document.getElementById('editExpenseModal').addEventListener('hidden.bs.modal', function () {
        this.querySelector('form').reset();
    });
</script>

</body>
</html>
